name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare project
        run: |
          if [ -f VidSaver.zip ]; then unzip -q -o VidSaver.zip; fi
          if [ -d VidSaver ]; then echo "PROJ=VidSaver" >> $GITHUB_ENV; else echo "PROJ=." >> $GITHUB_ENV; fi

      - name: Build APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VidSaver-APKs
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
