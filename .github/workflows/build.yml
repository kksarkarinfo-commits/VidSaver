name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare project (uses the most recently uploaded .zip, whatever its name)
        run: |
          shopt -s nullglob
          ZIP=""; NEWEST=0
          for f in *.zip; do
            T=$(git log -1 --format=%ct -- "$f")
            if [ "${T:-0}" -ge "$NEWEST" ]; then NEWEST=${T:-0}; ZIP="$f"; fi
          done
          if [ -n "$ZIP" ]; then
            echo "Using project zip: $ZIP"
            rm -rf _src && mkdir _src && unzip -q "$ZIP" -d _src
            GW=$(find _src -maxdepth 3 -name gradlew -type f | head -1)
            if [ -z "$GW" ]; then echo "::error::No Android project (gradlew) found inside $ZIP"; exit 1; fi
            echo "PROJ=$(dirname "$GW")" >> $GITHUB_ENV
          else
            echo "PROJ=." >> $GITHUB_ENV
          fi

      - name: Build signed APKs
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PbuildNumber=${{ github.run_number }} \
            -PupdateRepo=${{ github.repository }}
          BASE=$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION=${BASE:-1.3}.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: VidSaver ${{ env.VERSION }}
          body: ${{ github.event.head_commit.message || 'Bug fixes and improvements' }}
          files: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
          make_latest: true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: VidSaver-${{ env.VERSION }}
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
